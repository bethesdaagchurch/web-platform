name: CI — Type Check, Lint & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Use production secrets for develop branch
          # Use staging secrets for all other branches
          DATABASE_URI: ${{
            github.ref == 'refs/heads/main'
            && secrets.PROD_DATABASE_URI
            || secrets.STAGING_DATABASE_URI }}

          NEXT_PUBLIC_SUPABASE_URL: ${{
            github.ref == 'refs/heads/main'
            && secrets.PROD_SUPABASE_URL
            || secrets.STAGING_SUPABASE_URL }}

          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{
            github.ref == 'refs/heads/main'
            && secrets.PROD_SUPABASE_ANON_KEY
            || secrets.STAGING_SUPABASE_ANON_KEY }}

          SUPABASE_SERVICE_ROLE_KEY: ${{
            github.ref == 'refs/heads/main'
            && secrets.PROD_SUPABASE_SERVICE_ROLE_KEY
            || secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

          NEXT_PUBLIC_SITE_URL: ${{
            github.ref == 'refs/heads/main'
            && secrets.PROD_SITE_URL
            || secrets.STAGING_SITE_URL }}

          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

          SUPABASE_S3_ACCESS_KEY_ID: ${{
            github.ref == 'refs/heads/main'
            && secrets.PROD_SUPABASE_S3_ACCESS_KEY_ID
            || secrets.SUPABASE_S3_ACCESS_KEY_ID }}

          SUPABASE_S3_SECRET_ACCESS_KEY: ${{
            github.ref == 'refs/heads/main'
            && secrets.PROD_SUPABASE_S3_SECRET_ACCESS_KEY
            || secrets.STAGING_SUPABASE_S3_SECRET_ACCESS_KEY }}

          SUPABASE_S3_ENDPOINT: ${{
            github.ref == 'refs/heads/main'
            && secrets.PROD_SUPABASE_S3_ENDPOINT
            || secrets.STAGING_SUPABASE_S3_ENDPOINT }}

          SUPABASE_S3_BUCKET: ${{
            github.ref == 'refs/heads/main'
            && secrets.PROD_SUPABASE_S3_BUCKET
            || secrets.STAGING_SUPABASE_S3_BUCKET }}
